<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>UMUT KOD YAZIYOR!!!!</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1055/1055687.png">

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #000000, #1a1a1a, #ff0000);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            font-size: 60px;
            margin-top: 100px;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px red, 0 0 20px orange;
            }
            to {
                text-shadow: 0 0 20px yellow, 0 0 40px red;
            }
        }

        .typing {
            font-size: 25px;
            margin-top: 30px;
            border-right: 3px solid white;
            display: inline-block;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typing 4s steps(40, end) forwards, blink 0.7s infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 400px }
        }

        @keyframes blink {
            50% { border-color: transparent }
        }

        .code-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            font-size: 14px;
            white-space: pre;
            pointer-events: none;
        }

        button {
            margin-top: 50px;
            padding: 15px 30px;
            font-size: 18px;
            background: red;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.3s;
        }

        button:hover {
            background: orange;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="code-bg">
        function umut() { console.log("kod yazıyor!!!"); }
        for(let i=0;i<999;i++){ umut(); }
    </div>

    <h1>🔥 UMUT KOD YAZIYOR!!!! 🔥</h1>

    <div class="typing">Sistem yükleniyor... Kodlar akıyor...</div>

    <br>
    <button onclick="alert('Umut şu anda kod yazıyor 😎💻')">
        Durumu Kontrol Et
    </button>

</body>
</html>
